[General]
network = CoPerceptionNetwork
cmdenv-express-mode = false

# Parametri di canale semplici (senza mobilità reale)
*.manager.packetLoss = 0.1           # 0.0-1.0 probabilità di drop
*.manager.delayBase = 0.05s          # offset di base
*.manager.delayPerMeter = 0.000002s  # 2 microsecondi per metro (propagazione)
*.manager.delayPerByte = 0s          # opzionale: coda/throughput per dimensione
*.manager.delayJitter = 0.01s        # jitter uniforme in [-jitter, +jitter]